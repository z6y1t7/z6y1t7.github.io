<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黄时雨 | 个人名片</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            overflow-x: hidden;
            width: 100%;
        }

        :root {
            --bg: #F2F0EB;
            --page-bg: #FFFFFF;
            --dark-block: #1A1A1A;
            --text-primary: #1A1A1A;
            --text-secondary: #555555;
            --text-muted: #999999;
            --text-on-dark: #F0EDE6;
            --border: #E0DDD8;
            --shadow: rgba(0, 0, 0, 0.08);
            --ink: #1A1A1A;
            --ink-light: #C8C4BC;
            --paper-shadow: rgba(0,0,0,0.12);
        }

        body.dark {
            --bg: #141414;
            --page-bg: #1E1E1E;
            --dark-block: #F0EDE6;
            --text-primary: #EBEBEB;
            --text-secondary: #AAAAAA;
            --text-muted: #666666;
            --text-on-dark: #1A1A1A;
            --border: #333333;
            --shadow: rgba(0, 0, 0, 0.5);
            --ink: #E0E0E0;
            --ink-light: #404040;
            --paper-shadow: rgba(0,0,0,0.3);
        }

        body {
            font-family: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            transition: background-color 0.6s ease, color 0.6s ease;
            overflow-x: hidden;
            position: relative;
            width: 100%;
        }

        .bg-decorations {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .bg-scatter {
            position: absolute;
            opacity: 0.15;
        }

        .theme-toggle {
            position: fixed;
            top: 24px; right: 24px;
            padding: 10px 18px;
            background: var(--page-bg);
            color: var(--text-primary);
            border: 1px solid var(--ink);
            font-size: 11px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: -apple-system, sans-serif;
            z-index: 100;
        }

        .theme-toggle:hover {
            background: var(--ink);
            color: var(--bg);
        }

        .card-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            height: 680px;
            min-width: 0;
            overflow: hidden;
        }

        @media (max-height: 760px) {
            .card-container { height: 580px; }
        }

        .card-stack {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--page-bg);
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 30px var(--shadow);
        }

        .page:not(.active) {
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px) scale(0.97);
        }

        .page.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .tear-divider {
            position: absolute;
            left: 0; right: 0;
            height: 20px;
            z-index: 5;
            pointer-events: none;
        }

        .tear-divider svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .dark-block {
            background: var(--dark-block);
            color: var(--text-on-dark);
            position: relative;
        }

        .dark-block .tear-divider svg path {
            fill: var(--dark-block);
        }

        .light-block .tear-divider svg path {
            fill: var(--page-bg);
        }

        .corner-accent {
            position: absolute;
            font-size: 10px;
            letter-spacing: 3px;
            font-family: -apple-system, sans-serif;
            color: var(--text-muted);
            z-index: 10;
        }

        .corner-accent.tl { top: 20px; left: 24px; }
        .corner-accent.br { bottom: 20px; right: 24px; }

        .page-inner {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 44px;
            position: relative;
            z-index: 2;
        }

        .camellia-watermark {
            position: absolute;
            opacity: 0.04;
            pointer-events: none;
            z-index: 1;
        }

        .camellia-watermark.tr { top: -10px; right: -20px; width: 160px; height: 160px; }
        .camellia-watermark.bl { bottom: -10px; left: -20px; width: 140px; height: 140px; transform: scaleX(-1); }
        .camellia-watermark.tl { top: 30px; left: -10px; width: 100px; height: 100px; transform: rotate(-30deg); }
        .camellia-watermark.br { bottom: 20px; right: -10px; width: 110px; height: 110px; transform: rotate(45deg) scaleX(-1); }
        .camellia-watermark.small { width: 60px; height: 60px; opacity: 0.06; }
        .dark-block .camellia-watermark { opacity: 0.08; }

        .petal-scatter {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            opacity: 0.12;
        }

        .dark-block .petal-scatter { opacity: 0.15; }

        .camellia-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }

        .camellia-divider .div-line {
            flex: 1;
            max-width: 60px;
            height: 1px;
            background: var(--ink-light);
        }

        .dark-block .camellia-divider .div-line { background: rgba(240,237,230,0.3); }

        .camellia-divider svg {
            width: 18px;
            height: 18px;
        }

        .camellia-corner-deco {
            position: absolute;
            width: 70px;
            height: 70px;
            pointer-events: none;
            z-index: 2;
            opacity: 0.15;
        }

        .dark-block .camellia-corner-deco { opacity: 0.2; }

        .camellia-corner-deco.tr { top: 8px; right: 8px; }
        .camellia-corner-deco.bl { bottom: 8px; left: 8px; transform: rotate(180deg); }

        .floating-petals {
            position: absolute;
            pointer-events: none;
            z-index: 1;
        }

        .label {
            font-size: 10px;
            letter-spacing: 8px;
            color: var(--text-muted);
            margin-bottom: 40px;
            text-transform: uppercase;
            font-family: -apple-system, sans-serif;
        }

        .dark-block .label { color: rgba(240,237,230,0.5); }

        .main-title {
            font-size: 46px;
            font-weight: 400;
            letter-spacing: 14px;
            line-height: 1.5;
            margin-bottom: 12px;
            max-width: 100%;
            overflow-wrap: break-word;
        }

        .ornament {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 24px 0;
        }

        .orn-line {
            width: 50px;
            height: 1px;
            background: var(--ink-light);
        }

        .dark-block .orn-line { background: rgba(240,237,230,0.3); }

        .orn-diamond {
            width: 6px; height: 6px;
            border: 1px solid var(--ink);
            transform: rotate(45deg);
        }

        .dark-block .orn-diamond { border-color: rgba(240,237,230,0.6); }

        .subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 3px;
            font-style: italic;
        }

        .dark-block .subtitle { color: rgba(240,237,230,0.6); }

        .avatar-flower {
            width: 80px;
            height: 80px;
            margin-bottom: 28px;
        }

        .avatar-flower svg { width: 100%; height: 100%; }

        .name-big {
            font-size: 38px;
            font-weight: 400;
            letter-spacing: 14px;
            margin-bottom: 14px;
            max-width: 100%;
            overflow-wrap: break-word;
        }

        .name-sub {
            font-size: 10px;
            letter-spacing: 5px;
            color: var(--text-muted);
            font-family: -apple-system, sans-serif;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .dark-block .name-sub { color: rgba(240,237,230,0.5); }

        .info-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px 14px;
            margin-bottom: 8px;
        }

        .info-tag {
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dark-block .info-tag { color: rgba(240,237,230,0.75); }

        .info-dot {
            width: 3px; height: 3px;
            background: currentColor;
            border-radius: 50%;
            opacity: 0.5;
        }

        .bio {
            font-size: 14px;
            line-height: 2.2;
            letter-spacing: 2px;
            margin-top: 20px;
            color: var(--text-secondary);
        }

        .dark-block .bio { color: rgba(240,237,230,0.7); }

        .section-header {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 40px;
            width: 100%;
            justify-content: center;
        }

        .sec-line {
            flex: 1;
            max-width: 70px;
            height: 1px;
            background: var(--border);
        }

        .dark-block .sec-line { background: rgba(240,237,230,0.2); }

        .sec-label {
            font-size: 10px;
            letter-spacing: 6px;
            color: var(--text-muted);
            font-family: -apple-system, sans-serif;
        }

        .dark-block .sec-label { color: rgba(240,237,230,0.5); }

        .interest-list {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 240px;
        }

        .interest-row {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
            transition: padding-left 0.3s ease, border-color 0.3s ease;
            cursor: default;
        }

        .dark-block .interest-row { border-bottom-color: rgba(240,237,230,0.15); }

        .interest-row:first-child { border-top: 1px solid var(--border); }
        .dark-block .interest-row:first-child { border-top-color: rgba(240,237,230,0.15); }

        .interest-row:hover {
            padding-left: 14px;
        }

        .dark-block .interest-row:hover { border-color: rgba(240,237,230,0.5); }
        .light-block .interest-row:hover { border-color: var(--ink); }

        .int-num {
            font-size: 10px;
            color: var(--text-muted);
            font-family: -apple-system, sans-serif;
            min-width: 24px;
            letter-spacing: 1px;
        }

        .dark-block .int-num { color: rgba(240,237,230,0.4); }

        .int-name {
            font-size: 20px;
            letter-spacing: 6px;
        }

        .int-icon {
            margin-left: auto;
            font-size: 16px;
            opacity: 0.5;
        }

        .nav-btn {
            position: absolute;
            bottom: 28px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 10px;
            letter-spacing: 3px;
            color: var(--text-muted);
            font-family: -apple-system, sans-serif;
            transition: color 0.3s ease;
            padding: 8px 4px;
            z-index: 10;
            background: none;
            border: none;
        }

        .dark-block .nav-btn { color: rgba(240,237,230,0.4); }
        .nav-btn:hover { color: var(--text-primary); }
        .dark-block .nav-btn:hover { color: var(--text-on-dark); }

        .nav-btn.next { right: 28px; }
        .nav-btn.prev { left: 28px; }

        .nav-arrow {
            display: inline-block;
            width: 28px;
            height: 1px;
            background: currentColor;
            position: relative;
            transition: width 0.3s ease;
        }

        .nav-btn.next:hover .nav-arrow { width: 40px; }
        .nav-btn.prev:hover .nav-arrow { width: 40px; }

        .nav-arrow::after {
            content: '';
            position: absolute;
            width: 6px; height: 6px;
            border-top: 1px solid currentColor;
            border-right: 1px solid currentColor;
            top: -2.5px;
        }

        .nav-btn.next .nav-arrow::after { right: 0; transform: rotate(45deg); }
        .nav-btn.prev .nav-arrow::after { left: 0; transform: rotate(-135deg); }

        .indicator {
            position: fixed;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 14px;
            z-index: 10;
            align-items: center;
        }

        .ind-dot {
            width: 20px;
            height: 2px;
            background: var(--ink-light);
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            padding: 0;
        }

        .ind-dot.active {
            background: var(--ink);
            width: 36px;
        }

        .camellia-svg { stroke: currentColor; stroke-width: 1.1; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .dark-block .camellia-svg { opacity: 0.9; }
        .light-block .camellia-svg { color: var(--ink); }
        .dark-block .camellia-svg { color: var(--text-on-dark); }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page.active .label,
        .page.active .main-title,
        .page.active .camellia-divider,
        .page.active .subtitle,
        .page.active .avatar-flower,
        .page.active .name-big,
        .page.active .name-sub,
        .page.active .info-tags,
        .page.active .bio,
        .page.active .section-header,
        .page.active .interest-row {
            animation: fadeUp 0.5s ease forwards;
            opacity: 0;
        }

        .page.active .main-title { animation-delay: 0.1s; }
        .page.active .camellia-divider { animation-delay: 0.2s; }
        .page.active .subtitle { animation-delay: 0.3s; }
        .page.active .name-big { animation-delay: 0.1s; }
        .page.active .name-sub { animation-delay: 0.15s; }
        .page.active .info-tags { animation-delay: 0.22s; }
        .page.active .bio { animation-delay: 0.32s; }
        .page.active .section-header { animation-delay: 0.1s; }
        .page.active .interest-row:nth-of-type(1) { animation-delay: 0.2s; }
        .page.active .interest-row:nth-of-type(2) { animation-delay: 0.3s; }
        .page.active .interest-row:nth-of-type(3) { animation-delay: 0.4s; }

        @media (max-width: 480px) {
            body { padding: 12px 8px; }
            .card-container { height: 540px; }
            .page-inner { padding: 32px 24px; }
            .main-title { font-size: 30px; letter-spacing: 8px; }
            .name-big { font-size: 26px; letter-spacing: 6px; }
            .bio { font-size: 13px; letter-spacing: 1px; }
            .theme-toggle { top: 10px; right: 10px; padding: 8px 12px; font-size: 10px; }
            .nav-btn { bottom: 22px; font-size: 9px; }
            .nav-btn.next { right: 16px; }
            .nav-btn.prev { left: 16px; }
            .int-name { font-size: 18px; letter-spacing: 3px; }
            .avatar-flower { width: 68px; height: 68px; margin-bottom: 20px; }
            .info-tag { font-size: 11px; letter-spacing: 1px; }
            .label { letter-spacing: 5px; }
            .camellia-divider .div-line { max-width: 40px; }
            .petal-scatter { display: none; }
        }
    </style>
</head>

    <div class="bg-decorations">
        <div class="bg-scatter" style="top:5%;left:8%;">
            <svg width="90" height="90" viewBox="0 0 100 100" style="opacity:0.08"><use href="#camellia-branch" class="camellia-svg"/></svg>

        <div class="bg-scatter" style="top:15%;right:6%;">
            <svg width="50" height="50" viewBox="0 0 100 100" style="opacity:0.06"><use href="#camellia" class="camellia-svg"/></svg>
        </div>
        <div class="bg-scatter" style="bottom:15%;left:5%;">

    <script>
        (function() {
            const pages = document.querySelectorAll('.page');
            const dots = document.querySelectorAll('.ind-dot');
            const body = document.body;
            const toggle = document.getElementById('themeToggle');
            let currentPage = 0;
            let isAnimating = false;
            let isDark = false;

            function updateIndicators() {
                dots.forEach((d, i) => d.classList.toggle('active', i === currentPage));
            }

            function resetAnims(el) {
                const items = el.querySelectorAll('.label,.main-title,.camellia-divider,.subtitle,.avatar-flower,.name-big,.name-sub,.info-tags,.bio,.section-header,.interest-row');
                items.forEach(i => { i.style.animation = 'none'; i.offsetHeight; i.style.animation = ''; });
            }

            function goToPage(t) {
                if (isAnimating || t === currentPage || t < 0 || t >= pages.length) return;
                isAnimating = true;
                pages[currentPage].classList.remove('active');
                pages[t].classList.add('active');
                resetAnims(pages[t]);
                currentPage = t;
                updateIndicators();
                setTimeout(() => { isAnimating = false; }, 550);
            }

            window.nextPage = () => goToPage(currentPage + 1);
            window.prevPage = () => goToPage(currentPage - 1);
            window.goToPage = goToPage;

            function setTheme(dark) {
                isDark = dark;
                body.classList.toggle('dark', dark);
                toggle.textContent = dark ? 'DAY' : 'NIGHT';
            }

            toggle.addEventListener('click', () => setTheme(!isDark));

            document.addEventListener('keydown', e => {
                if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextPage(); }
                else if (e.key === 'ArrowLeft') { e.preventDefault(); prevPage(); }
            });

            let sx = 0;
            document.addEventListener('touchstart', e => { sx = e.changedTouches[0].screenX; }, false);
            document.addEventListener('touchend', e => {
                const dx = sx - e.changedTouches[0].screenX;
                if (Math.abs(dx) > 50) dx > 0 ? nextPage() : prevPage();
            }, false);

            updateIndicators();
            setTheme(false);
        })();
    </script>
